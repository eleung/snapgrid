version: 2
updates:
  # npm/pnpm dependencies across the workspace (directory "/" covers the
  # pnpm workspace, including apps/* and packages/*).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Batch routine bumps into two PRs instead of dozens, to cut review noise.
      production-dependencies:
        dependency-type: production
      dev-dependencies:
        dependency-type: development

  # Keep GitHub Actions in .github/workflows pinned and current.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # changesets/action majors are coupled to the Changesets CLI major:
      # action v2 requires CLI v3 and hard-fails against CLI v2, and it renames
      # the publish/version inputs. Bumping it alone breaks every release run.
      # Lift this ignore in the same change that moves @changesets/cli to v3.
      - dependency-name: changesets/action
        update-types: ["version-update:semver-major"]
